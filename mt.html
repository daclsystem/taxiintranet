<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z Movilidad - Tracking de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        
        function detectTheme() {
            const theme = localStorage.getItem('theme') || 'system';
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            return theme === 'dark' || (theme === 'system' && systemPrefersDark);
        }
        
        (function() {
            if (detectTheme()) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        .map-wrapper { position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <div id="app">
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500 mx-auto mb-4"></div>
                <p class="text-gray-600 dark:text-gray-400">Cargando tracking...</p>
            </div>
        </div>
    </div>

    <script>
        let map, tileLayer, trackingData;
        const DARK_TILE = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        const LIGHT_TILE = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
        const OSRM_API = 'https://router.project-osrm.org/route/v1/driving';

        function decodePolyline(encoded) {
            const points = [];
            let index = 0, lat = 0, lng = 0;
            while (index < encoded.length) {
                let b, shift = 0, result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                points.push([lat / 1e5, lng / 1e5]);
            }
            return points;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('key');

        if (!token) {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
                    <div class="text-center max-w-md mx-auto p-6">
                        <div class="w-16 h-16 bg-red-100 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                            </svg>
                        </div>
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Token no válido</h2>
                        <p class="text-gray-600 dark:text-gray-400">No se proporcionó un token válido.</p>
                    </div>
                </div>`;
        } else {
            cargarTracking(token);
        }

        async function cargarTracking(token) {
            try {
                const response = await fetch(`https://apiservices.zmovilidad.app/api/Operaciones/Tracking?tokens=${token}&tservicio=1`);
                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
                const data = await response.json();
                if (data.estatus !== 200) throw new Error(data.message || 'Error al obtener tracking');
                trackingData = data;
                mostrarTracking(data);
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
                        <div class="text-center max-w-md mx-auto p-6">
                            <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Error</h2>
                            <p class="text-gray-600 dark:text-gray-400 mb-4">${error.message}</p>
                            <button onclick="location.reload()" class="px-4 py-2 bg-orange-600 text-white rounded-lg">Reintentar</button>
                        </div>
                    </div>`;
            }
        }

        function mostrarTracking(data) {
            const { otservicio, aotpuntos, asrutagps } = data;
            const esPendiente = otservicio.idestado === 7;
            const esEnCamino = otservicio.idestado === 8;
            
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50 dark:bg-gray-900">
                    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex items-center justify-between h-16">
                                <h1 class="text-xl font-bold text-gray-900 dark:text-white">Tracking - Servicio #${otservicio.idservicio}</h1>
                                <div class="flex items-center gap-4">
                                    <div id="route-info" class="hidden text-sm font-semibold text-blue-600 dark:text-blue-400"></div>
                                    <button onclick="toggleTheme()" class="p-2 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                                        <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        <div class="grid lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-1 space-y-6">
                                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                                    <div class="text-center mb-4">
                                        <div class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium mb-4" style="background-color: ${otservicio.colorcelda}; color: ${otservicio.colortexto}">${otservicio.estado}</div>
                                        <div class="text-3xl font-bold text-gray-900 dark:text-white mb-2">S/ ${otservicio.costototal.toFixed(2)}</div>
                                    </div>
                                    <div class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
                                        <div>Fecha: ${otservicio.fecha} · Hora: ${otservicio.hora}</div>
                                        <div>Tipo pago: ${otservicio.tipo}</div>
                                    </div>
                                </div>
                                ${!esPendiente ? `
                                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                                    <div class="flex items-center space-x-4">
                                        <img src="${otservicio.foto}" alt="Conductor" class="w-16 h-16 rounded-full object-cover">
                                        <div>
                                            <h3 class="font-bold text-gray-900 dark:text-white">${otservicio.nombres}</h3>
                                            <div class="text-sm text-gray-600 dark:text-gray-400">${otservicio.nplaca}</div>
                                            ${esEnCamino ? `<div class="text-sm text-gray-600 dark:text-gray-400">${otservicio.telefonoprincipal}</div>` : ''}
                                        </div>
                                    </div>
                                </div>` : ''}
                                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-200 dark:border-gray-700">
                                    <h3 class="font-bold text-gray-900 dark:text-white mb-4">Recorrido</h3>
                                    <div class="space-y-3">
                                        ${aotpuntos.map((p, i) => `
                                        <div class="flex items-start space-x-3">
                                            <div class="w-6 h-6 rounded-full flex items-center justify-center ${i === 0 ? 'bg-green-500' : i === aotpuntos.length - 1 ? 'bg-red-500' : 'bg-orange-500'}">
                                                <span class="text-white text-xs font-bold">${i === 0 ? 'O' : i === aotpuntos.length - 1 ? 'D' : i}</span>
                                            </div>
                                            <div class="flex-1 text-sm text-gray-700 dark:text-gray-300">${p.direccion}</div>
                                        </div>`).join('')}
                                    </div>
                                </div>
                            </div>
                            <div class="lg:col-span-2 h-[800px]">
                                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden h-full map-wrapper">
                                    <div id="map"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            updateThemeIcon();
            initMap();
        }

        function toggleTheme() {
            const wasLight = !document.documentElement.classList.contains('dark');
            if (wasLight) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
            updateThemeIcon();
            if (tileLayer) {
                const isDark = document.documentElement.classList.contains('dark');
                tileLayer.setUrl(isDark ? DARK_TILE : LIGHT_TILE);
            }
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (!icon) return;
            const isDark = document.documentElement.classList.contains('dark');
            icon.innerHTML = isDark 
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        }

        async function initMap() {
            const { otservicio, aotpuntos, asrutagps } = trackingData;
            const esCompletado = [12, 13, 14].includes(otservicio.idestado);
            const center = aotpuntos.length > 0 ? [aotpuntos[0].latitude, aotpuntos[0].longitude] : [-12.0464, -77.0428];

            // Detectar tema correctamente usando la función global
            const isDark = detectTheme();

            map = L.map('map', { zoomControl: true }).setView(center, 13);
            tileLayer = L.tileLayer(isDark ? DARK_TILE : LIGHT_TILE, { attribution: '&copy; CARTO' }).addTo(map);

            // Forzar que Leaflet recalcule el tamaño del contenedor
            setTimeout(() => { map.invalidateSize(); }, 200);

            const bounds = L.latLngBounds();

            function createIcon(color) {
                const svg = `<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="16" fill="${color}" stroke="white" stroke-width="4"/><circle cx="20" cy="20" r="6" fill="white"/></svg>`;
                return L.divIcon({ html: `<img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}" style="width:40px;height:40px;"/>`, iconSize: [40, 40], iconAnchor: [20, 20], className: '' });
            }

            aotpuntos.forEach((p, i) => {
                const color = i === 0 ? '#10b981' : i === aotpuntos.length - 1 ? '#ef4444' : '#f59e0b';
                L.marker([p.latitude, p.longitude], { icon: createIcon(color) }).addTo(map).bindPopup(`<b>${i === 0 ? 'Origen' : i === aotpuntos.length - 1 ? 'Destino' : `Punto ${i}`}</b><br/>${p.direccion}`);
                bounds.extend([p.latitude, p.longitude]);
            });

            const esActivo = [8, 9, 10, 11].includes(otservicio.idestado);
            if (esActivo && otservicio.latitude && otservicio.longitude && otservicio.latitude !== 0) {
                const svg = `<svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg"><circle cx="22" cy="22" r="18" fill="#3b82f6" stroke="white" stroke-width="4"/><path d="M22 12 L28 28 L22 24 L16 28 Z" fill="white"/></svg>`;
                const icon = L.divIcon({ html: `<img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}" style="width:44px;height:44px;"/>`, iconSize: [44, 44], iconAnchor: [22, 22], className: '' });
                L.marker([otservicio.latitude, otservicio.longitude], { icon }).addTo(map).bindPopup(`<b>Conductor</b><br/>${otservicio.nombres}`);
                bounds.extend([otservicio.latitude, otservicio.longitude]);
            }

            // Calcular ruta con OSRM
            if (aotpuntos.length >= 2) {
                const coords = aotpuntos.map(p => `${p.longitude},${p.latitude}`).join(';');
                try {
                    const res = await fetch(`${OSRM_API}/${coords}?overview=full&geometries=polyline`);
                    const data = await res.json();
                    if (data.code === 'Ok' && data.routes?.[0]) {
                        const route = data.routes[0];
                        const geometry = decodePolyline(route.geometry);
                        L.polyline(geometry, { color: '#3b82f6', weight: 5, opacity: 0.8 }).addTo(map);
                        
                        const distKm = (route.distance / 1000).toFixed(1);
                        const durMin = Math.ceil(route.duration / 60);
                        const info = document.getElementById('route-info');
                        if (info) { info.classList.remove('hidden'); info.textContent = `${distKm} km · ${durMin} min`; }
                    }
                } catch (e) { console.error('Error OSRM:', e); }
            }

            // Ruta GPS completada
            if (esCompletado && asrutagps?.length > 1) {
                const gpsCoords = asrutagps.map(p => [p.latitude, p.longitude]);
                L.polyline(gpsCoords, { color: '#10b981', weight: 5, opacity: 0.9 }).addTo(map);
                asrutagps.forEach(p => bounds.extend([p.latitude, p.longitude]));
            }

            if (bounds.isValid()) {
                // Esperar a que el mapa tenga tamaño correcto antes de ajustar vista
                setTimeout(() => {
                    map.invalidateSize();
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                }, 300);
            }
        }
    </script>
</body>
</html>
